<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{fragments/layout :: head('Verifikasi Klaim')}"></head>
<body>
<div class="phone">
    <div th:replace="~{fragments/layout :: statusBar}"></div>

    <div class="screen">
        <div class="stack gap-24">
            <div class="back-header" style="height:49px;">
                <a th:href="@{/klaim}" class="back-btn"><img th:src="@{/img/back.svg}" width="36" height="36" alt="Kembali"></a>
                <div class="text">
                    <p class="h6">Verifikasi Klaim</p>
                    <p>Verifikasi klaim barang yang diajukan</p>
                </div>
            </div>

            <div class="stack gap-12">
                <div class="stack gap-12">
                    <div th:replace="~{fragments/layout :: bigCard(${barang})}"></div>

                    <div class="claimer-card">
                        <div class="claimer-top">
                            <img class="foto"
                                 th:src="${klaim.user != null and klaim.user.foto != null} ? ${klaim.user.foto} : '/img/avatar-claimer.png'"
                                 width="100" height="100" alt="">
                            <div class="stack gap-4">
                                <p class="card-title" th:text="${klaim.nama}">Nama</p>
                                <div class="meta"><span class="ico16"><img th:src="@{/img/ic-mail16.svg}" alt=""></span><span th:text="${klaim.email}">email</span></div>
                                <div class="meta"><span class="ico16"><img th:src="@{/img/ic-phone16.svg}" alt=""></span><span th:text="${klaim.telepon}">telp</span></div>
                            </div>
                        </div>
                        <hr>
                        <div class="claim-detail">
                            <p class="judul">Detail Klaim</p>
                            <p th:text="${klaim.detail}">Detail</p>
                            <img th:if="${klaim.bukti != null}" th:src="${klaim.bukti}" alt="Bukti kepemilikan">
                        </div>
                    </div>
                </div>

                <div class="stack gap-8" th:if="${klaim.status == 'MENUNGGU'}">
                    <form th:action="@{/klaim/verifikasi/{id}/terima(id=${klaim.id})}" method="post">
                        <button type="submit" class="btn btn-primary">Verifikasi Klaim</button>
                    </form>
                    <form th:action="@{/klaim/verifikasi/{id}/tolak(id=${klaim.id})}" method="post">
                        <button type="submit" class="btn btn-outline">Tolak Klaim</button>
                    </form>
                </div>
                <p th:unless="${klaim.status == 'MENUNGGU'}" class="center-note"
                   th:text="'Klaim ini sudah ' + ${klaim.status == 'DITERIMA' ? 'diterima' : 'ditolak'} + '.'">status</p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: homeIndicator}"></div>
</div>
</body>
</html>
