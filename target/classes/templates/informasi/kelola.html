<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{fragments/layout :: head('Informasi Barang')}"></head>
<body>
<div class="phone">
    <div th:replace="~{fragments/layout :: statusBar}"></div>
    <div th:replace="~{fragments/layout :: toast}"></div>

    <div class="screen">
        <form th:action="@{/barang/{id}/perbarui(id=${barang.id})}" method="post" class="stack gap-24">
            <div class="back-header" style="height:67px;">
                <a th:href="@{/informasi}" class="back-btn"><img th:src="@{/img/back.svg}" width="36" height="36" alt="Kembali"></a>
                <div class="text">
                    <p class="h6">Informasi Barang</p>
                    <p>Detail informasi dan pengelolaan penyimpanan barang</p>
                </div>
            </div>

            <div class="stack gap-12">
                <div th:if="${barang.status == 'KLAIM'}" class="claimed-banner">
                    <img th:src="@{/img/ic-check-green.svg}" alt="">
                    <span th:text="'Telah di klaim pada ' + ${barang.tanggalKlaimText}">Telah di klaim</span>
                </div>

                <div th:replace="~{fragments/layout :: bigCard(${barang})}"></div>

                <div class="field">
                    <span class="field-label">Deskripsi Barang</span>
                    <div class="text-box" th:text="${barang.deskripsi}">Deskripsi</div>
                </div>

                <!-- lokasi saat ini (dropdown) -->
                <div class="field">
                    <span class="field-label">Lokasi Saat Ini</span>
                    <input type="hidden" id="simpan-value" name="lokasiSimpan" th:value="${barang.lokasiSimpan}">
                    <div class="input-box select" onclick="toggleDropdown('simpan-popup')" style="gap:12px;">
                        <span class="ico"><img th:src="@{/img/ic-pin.svg}" alt=""></span>
                        <span id="simpan-label" class="placeholder" th:text="${barang.lokasiSimpan != null ? barang.lokasiSimpan : 'Pilih lokasi'}">Lokasi</span>
                        <span class="caret"><img th:src="@{/img/caret.svg}" alt=""></span>
                    </div>
                    <div id="simpan-popup" class="dropdown">
                        <button type="button" class="opt" onclick="pilihOpsi('simpan', 'Satpam Gedung F Lantai 1')">Satpam Gedung F Lantai 1</button>
                        <button type="button" class="opt" onclick="pilihOpsi('simpan', 'Satpam Gedung G Lantai 1')">Satpam Gedung G Lantai 1</button>
                        <button type="button" class="opt" onclick="pilihOpsi('simpan', 'Gudang FILKOM')">Gudang FILKOM</button>
                    </div>
                </div>

                <!-- durasi penyimpanan -->
                <div class="field">
                    <span class="field-label">Durasi Penyimpanan</span>
                    <div class="field">
                        <input type="hidden" id="mulai-value" name="tanggalMulai" th:value="${barang.tanggalMulai}">
                        <div class="input-box select" onclick="bukaKalender('mulai')">
                            <span class="ico"><img th:src="@{/img/ic-cal.svg}" alt=""></span>
                            <span id="mulai-label" class="placeholder pre" data-prefix="Tanggal Mulai    : "
                                  th:text="'Tanggal Mulai    : ' + ${barang.tanggalMulaiText}">Mulai</span>
                            <span class="caret"><img th:src="@{/img/caret.svg}" alt=""></span>
                        </div>
                        <div id="mulai-popup" class="calendar">
                            <div class="cal-head">
                                <button type="button" onclick="gantiBulan('mulai', -1)">&lsaquo;</button>
                                <span id="mulai-judul"></span>
                                <button type="button" onclick="gantiBulan('mulai', 1)">&rsaquo;</button>
                            </div>
                            <div id="mulai-grid" class="cal-grid"></div>
                        </div>
                    </div>
                    <div class="field">
                        <input type="hidden" id="akhir-value" name="tanggalAkhir" th:value="${barang.tanggalAkhir}">
                        <div class="input-box select" onclick="bukaKalender('akhir')">
                            <span class="ico"><img th:src="@{/img/ic-cal.svg}" alt=""></span>
                            <span id="akhir-label" class="placeholder pre" data-prefix="Tanggal Akhir     : "
                                  th:text="'Tanggal Akhir     : ' + ${barang.tanggalAkhirText}">Akhir</span>
                            <span class="caret"><img th:src="@{/img/caret.svg}" alt=""></span>
                        </div>
                        <div id="akhir-popup" class="calendar">
                            <div class="cal-head">
                                <button type="button" onclick="gantiBulan('akhir', -1)">&lsaquo;</button>
                                <span id="akhir-judul"></span>
                                <button type="button" onclick="gantiBulan('akhir', 1)">&rsaquo;</button>
                            </div>
                            <div id="akhir-grid" class="cal-grid"></div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="height:37px;">Perbarui Informasi</button>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: homeIndicator}"></div>
</div>
</body>
</html>
