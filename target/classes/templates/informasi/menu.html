<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{fragments/layout :: head('Informasi Barang')}"></head>
<body>
<div class="phone">
    <div th:replace="~{fragments/layout :: statusBar}"></div>

    <div class="screen with-nav">
        <div class="stack gap-24">
            <div class="page-header">
                <div class="text auto">
                    <p class="h4" style="white-space:nowrap;">Informasi Barang</p>
                    <p class="sub">Verifikasi klaim barang yang diajukan</p>
                </div>
                <img th:src="@{/img/hero-backpack.svg}" width="60" height="60" alt="">
            </div>

            <div class="stack gap-12">
                <div class="tabs">
                    <a th:href="@{/informasi(tab='terbaru')}" th:class="${tab == 'terbaru'} ? 'tab active' : 'tab'">Terbaru</a>
                    <a th:href="@{/informasi(tab='hilang')}" th:class="${tab == 'hilang'} ? 'tab active' : 'tab'">Barang Hilang</a>
                    <a th:href="@{/informasi(tab='temuan')}" th:class="${tab == 'temuan'} ? 'tab last active' : 'tab last'">Barang Temuan</a>
                </div>

                <div class="grid">
                    <th:block th:each="b : ${daftarBarang}">
                        <a th:replace="~{fragments/layout :: card(${b}, @{/barang/{id}(id=${b.id})})}"></a>
                    </th:block>
                </div>
                <p th:if="${#lists.isEmpty(daftarBarang)}" class="empty">Belum ada barang.</p>
            </div>
        </div>
    </div>

    <nav th:replace="~{fragments/layout :: navbar('informasi')}"></nav>
    <div th:replace="~{fragments/layout :: homeIndicator}"></div>
</div>
</body>
</html>
