<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{fragments/layout :: head('Klaim Barang')}"></head>
<body>
<div class="phone">
    <div th:replace="~{fragments/layout :: statusBar}"></div>

    <div class="screen wide">
        <form th:action="@{/klaim/ajukan/{id}(id=${barang.id})}" method="post" enctype="multipart/form-data" class="stack gap-24">
            <div class="back-header" style="height:67px;">
                <a th:href="@{/klaim}" class="back-btn"><img th:src="@{/img/back.svg}" width="36" height="36" alt="Kembali"></a>
                <div class="text">
                    <p class="h6">Klaim Barang</p>
                    <p>Lengkapi informasi untuk verifikasi klaim barang</p>
                </div>
            </div>

            <div class="stack gap-24" style="padding:4px 4px 40px;">
                <div class="stack gap-12">
                    <a th:href="@{/barang/{id}(id=${barang.id})}">
                        <div th:replace="~{fragments/layout :: bigCard(${barang})}"></div>
                    </a>

                    <div th:if="${error != null}" class="alert" th:text="${error}">Error</div>

                    <div class="field">
                        <label class="field-label" for="nama">Nama</label>
                        <div class="input-box">
                            <span class="ico"><img th:src="@{/img/ic-user.svg}" alt=""></span>
                            <input type="text" id="nama" name="nama" placeholder="Masukkan nama anda"
                                   th:value="${param.nama != null ? param.nama : ''}" required>
                        </div>
                    </div>
                    <div class="field">
                        <label class="field-label" for="email">Email</label>
                        <div class="input-box">
                            <span class="ico"><img th:src="@{/img/ic-mail2.svg}" alt=""></span>
                            <input type="email" id="email" name="email" placeholder="Masukkan email anda"
                                   th:value="${param.email != null ? param.email : ''}" required>
                        </div>
                    </div>
                    <div class="field">
                        <label class="field-label" for="telepon">Nomor Telepon</label>
                        <div class="input-box">
                            <span class="ico"><img th:src="@{/img/ic-phone.svg}" alt=""></span>
                            <input type="tel" id="telepon" name="telepon" placeholder="Masukkan nomor telepon anda"
                                   th:value="${param.telepon != null ? param.telepon : ''}" required>
                        </div>
                    </div>
                    <div class="field">
                        <label class="field-label" for="detail">Detail Klaim</label>
                        <div class="input-box">
                            <span class="ico"><img th:src="@{/img/ic-bag.svg}" alt=""></span>
                            <textarea id="detail" name="detail" placeholder="Deskripsikan barang hilang anda"></textarea>
                        </div>
                    </div>
                    <div class="field" style="align-items:center;">
                        <span class="field-label" style="width:100%;">Bukti Kepemilikan</span>
                        <input type="file" id="bukti" name="bukti" accept="image/*" class="hidden-file" onchange="tampilkanPreview(this)">
                        <div class="upload-box" onclick="bukaSheet('bukti')"
                             ondragover="seretMasuk(event, this)" ondragleave="seretKeluar(this)"
                             ondrop="lepasFile(event, this, 'bukti')">
                            <img id="bukti-icon" th:src="@{/img/ic-addphoto.svg}" width="48" height="48" alt="">
                            <img id="bukti-preview" class="preview" alt="">
                            <p class="t1">Tambah Foto</p>
                            <p class="t2">atau seret gambar ke sini</p>
                            <p class="t3">(Sertakan foto barang, struk pembelian, dll)</p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Kirim Laporan</button>
            </div>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: sheet}"></div>
    <div th:replace="~{fragments/layout :: homeIndicator}"></div>
</div>
</body>
</html>
